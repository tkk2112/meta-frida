name: Main

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Main / oelint-adv
    runs-on: ubuntu-24.04

    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dev/scripts/uv.lock

      - name: Install tooling
        run: uv sync --frozen --project dev/scripts

      - name: Check formatting
        run: make check-format

      - name: Run oelint-adv
        run: make lint

  parse:
    name: Main / BitBake parse
    runs-on: ubuntu-24.04

    env:
      CONTAINER_ENGINE: docker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Wrynose metadata
        run: ./dev/scripts/yocto shell dev/kas/base.yml -c 'bitbake -p'
